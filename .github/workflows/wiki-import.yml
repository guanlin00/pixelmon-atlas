name: Refresh Pixelmon Wiki reference data
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Starting National Pokédex number (1-1025)'
        required: true
        default: '1'
      batch_size:
        description: 'Number of species pages to import (recommend 20 first)'
        required: true
        default: '20'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Import Pixelmon Wiki data
        run: python pixelmon-web/import_pixelmon_wiki.py --start "${{ inputs.start }}" --batch-size "${{ inputs.batch_size }}" --global-drops
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixelmon-web/wiki-reference.json
          if ! git diff --staged --quiet; then
            git commit -m "data: update Pixelmon Wiki reference batch"
            git push
          fi
