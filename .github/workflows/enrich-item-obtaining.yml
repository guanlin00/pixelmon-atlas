name: Verify individual Pixelmon item acquisition references
on:
  push:
    paths:
      - .github/workflows/enrich-item-obtaining.yml
      - pixelmon-web/tools/enrich_item_obtaining.py
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Check individual Pixelmon item source pages
        run: python pixelmon-web/tools/enrich_item_obtaining.py
      - name: Commit the enriched data and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixelmon-web/pixelmon-item-index.json pixelmon-web/item-source-audit.json
          git diff --cached --quiet || (git commit -m "data: record individual Pixelmon item acquisition references and missing-data audit" && git push)
