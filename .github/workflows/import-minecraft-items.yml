name: Import Minecraft vanilla item recipes and names
on:
  push:
    paths:
      - .github/workflows/import-minecraft-items.yml
      - pixelmon-web/tools/import_minecraft_registry.py
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Import Minecraft 1.21.1 items and crafting recipes
        run: python pixelmon-web/tools/import_minecraft_registry.py
      - name: Commit validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixelmon-web/minecraft-item-index.json
          git diff --cached --quiet || (git commit -m "data: import vanilla Minecraft items and Chinese crafting recipes" && git push)
