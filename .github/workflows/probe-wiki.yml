name: Probe Pixelmon Wiki data sources
on:
  push:
    paths:
      - .github/workflows/probe-wiki.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests
          urls=[
            'https://pixelmonmod.com/wiki/Bulbasaur',
            'https://r.jina.ai/https://pixelmonmod.com/wiki/Bulbasaur',
            'https://r.jina.ai/http://pixelmonmod.com/wiki/Bulbasaur',
            'https://pixelmonmod.com/wiki/Generation_I_Spawning',
            'https://r.jina.ai/https://pixelmonmod.com/wiki/Drops',
            'https://pixelmonmod.com/api.php?action=parse&page=Bulbasaur&prop=wikitext&format=json',
            'https://pixelmon.site/bulbasaur/',
            'https://pixelmon.site/charmander/',
            'https://sorb-pixelmon.fandom.com/wiki/Bulbasaur',
          ]
          for u in urls:
            try:
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0'})
              print(r.status_code,len(r.content),r.url,r.text[:100].replace('\n',' '),flush=True)
            except Exception as e:print('ERROR',u,str(e)[:140],flush=True)
          from bs4 import BeautifulSoup
          text=requests.get('https://pixelmon.site/bulbasaur/',timeout=30).text
          soup=BeautifulSoup(text,'html.parser')
          for h in soup.find_all(['h2','h3']):
            if h.get_text(' ',strip=True).lower() in ['spawn','drops','spawn variant 1']:
              print('HEADING',h.name,h.get_text(' ',strip=True),flush=True)
              n=h
              for i in range(4):
                n=n.find_next_sibling()
                if n is None:break
                print('SIBLING',n.name,n.get_text(' ',strip=True)[:500],str(n)[:200].replace('\\n',' '),flush=True)
                    PY
