name: Probe Pixelmon Wiki data sources
on:
  push:
    paths:
      - .github/workflows/probe-wiki.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://pixelmon.site/bulbasaur/'
          r=requests.get(url,timeout=30)
          print(r.status_code,len(r.content))
          soup=BeautifulSoup(r.text,'html.parser')
          for h in soup.find_all(['h2','h3']):
              if h.get_text(' ',strip=True).lower() in ('spawn','drops','spawn variant 1'):
                  print('HEADING',h.name,h.get_text(' ',strip=True))
                  n=h
                  for i in range(6):
                      n=n.find_next_sibling()
                      if n is None: break
                      print('SIBLING',n.name,n.get_text(' ',strip=True)[:450],str(n)[:160].replace('\n',' '))
          PY
