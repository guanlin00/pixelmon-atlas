name: Import all 151 Gen I Pixelmon reference entries
on:
  push:
    paths:
      - .github/workflows/import-gen1.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install requests beautifulsoup4
      - name: Import and validate complete Generation I
        run: python pixelmon-web/tools/import_gen1_reference.py
      - name: Commit the checked data (only after validation passes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixelmon-web/wiki-reference.json pixelmon-web/gen1-import-audit.csv
          git diff --cached --quiet || (git commit -m "data: import 151 Gen I spawn and drop references" && git push)
