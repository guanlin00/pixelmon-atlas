name: Probe Pixelmon item tables
on:
  push:
    paths:
      - .github/workflows/probe-items.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests
          for spriteUrl in ['https://pixelmon.site/images/pi.png','https://pixelmon.site/recipes-img/i001.png']:
            r=requests.get(spriteUrl,timeout=25);print('ICON_CHECK',spriteUrl,r.status_code,len(r.content),r.headers.get('content-type'),r.content[:8].hex(),flush=True)
          from bs4 import BeautifulSoup
          for url in ['https://pixelmon.site/id/','https://pixelmon.site/recipes/','https://pixelmon.site/master-ball/','https://pixelmon.site/healer/']:
            try:
              r=requests.get(url,timeout=35,headers={'User-Agent':'Mozilla/5.0'})
              print('PAGE',url,r.status_code,len(r.content),flush=True)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              ts=soup.find_all('table')
              print('TABLE_COUNT',len(ts),flush=True)
              for t in ts[:2]:
                trs=t.find_all('tr')
                print('TABLE',t.get('class'),len(trs),str(trs[0])[:480] if trs else '',flush=True)
                for tr in trs[1:4]:
                  print('ROW',[td.get_text(' ',strip=True)[:100] for td in tr.find_all(['td','th'],recursive=False)],'IMG',[(im.get('src'),im.get('data-src')) for im in tr.find_all('img')][:2],flush=True)
              if 'id/' in url:
                for tag in soup.find_all(['style','link']):
                  if tag.name=='link' and 'stylesheet' in (tag.get('rel') or []):
                    href=tag.get('href','')
                    if not href:continue
                    cssUrl=requests.compat.urljoin(url,href)
                    try:
                      cssText=requests.get(cssUrl,timeout=15).text
                      import re
                      for m in re.finditer(r'\.pi\s*\{[^}]+\}',cssText):print('ICON_CSS',cssUrl,m.group(0)[:750],flush=True)
                      for pat in ['.pi{','.pi {','i.pi','background-image: url(','background-image:url(','item-sprite','items.png','pixelmon-sprite']:
                        at=cssText.find(pat)
                        if at>=0:print('STYLE_MATCH',cssUrl,pat,cssText[max(0,at-150):at+550].replace('\\n',' '),flush=True)
                    except Exception as ex:print('CSS_ERR',cssUrl,str(ex)[:90],flush=True)
                print('INLINE_STYLES',[(z.get('src'),z.get('href')) for z in soup.find_all(['script','link']) if 'sprite' in str(z).lower()][:10],flush=True)
                import re
                for term in ['.pi {','.pi{','sprites.png','sprites.jpg','sprite.png','spritesheet','pixelmon-items']:
                    at=r.text.find(term)
                    if at>=0:print('HTML_SPRITE_CONTEXT',term,r.text[max(0,at-170):at+420].replace('\\n',' '),flush=True)
                for row in ts[0].find_all('tr')[1:4]:
                  print('RAW_ID_ROW',str(row)[:1500].replace('\\n',' '),flush=True)
                for row in ts[0].find_all('tr'):
                  if 'TM01' in row.get_text(' ',strip=True) or 'TR42' in row.get_text(' ',strip=True) or 'Galarian TM' in row.get_text(' ',strip=True):
                    print('RAW_TM_ROW',str(row)[:1600].replace('\\n',' '),flush=True)
                    break
              if 'master-ball/' in url:
                for h in soup.find_all(['h2','h3']):
                  if h.get_text(' ',strip=True)=='Obtaining':
                    n=h.find_next_sibling();print('OBTAIN',str(n)[:2000] if n else '',flush=True)
              for h in soup.find_all(['h2','h3'])[:14]:
                print('HEADING',h.get_text(' ',strip=True)[:140],flush=True)
            except Exception as ex:
              print('ERROR',str(ex),flush=True)
          PY
