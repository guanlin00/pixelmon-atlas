  <script>
    // Disable the browser's automatic scroll restoration on full reloads.
    // In-app Pokédex navigation keeps its own return-position behavior.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    // A full page load/reload always opens the home page, regardless of the old hash.
    // Normal in-app navigation between pages is unaffected.
    if (location.hash && location.hash !== '#home') {
      history.replaceState(null, '', location.pathname + location.search + '#home');
    }
    window.addEventListener('pageshow', function (event) {
      // Do not interfere with a back/forward cache restore.
      if (event.persisted) return;
      window.scrollTo(0, 0);
      requestAnimationFrame(function () { window.scrollTo(0, 0); });
    });
  </script>
